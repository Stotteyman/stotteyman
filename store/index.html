<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Store Item List</title>
    <meta name="description" content="A list of store items with clickable squares and buttons.">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Store Item List</h1>
        <div class="item-grid">
            <div class="item">
                <a href="#" class="item-link">
                    <div class="item-image" style="background-image: url(https://dummyimage.com/300x300/000/fff);"></div>
                </a>
                <div class="item-details">
                    <h2>Item Name</h2>
                    <p>$10.00</p>
                    <stripe-buy-button
                        buy-button-id="buy_btn_1MkL8SCYfgL2SDGtNNMuTviq"
                        publishable-key="pk_live_51MipdfCYfgL2SDGtEr49qYrKHNPdBTC8Rru3EzwAgXMoVmNvLFpaiy6l3gQuXK0spPwJNgyRSvKGB4WxZVTt9SZ100zJMInUfu"
                    ></stripe-buy-button>
                </div>
            </div>
            <!-- Repeat this .item div for each item in the list -->
        </div>
    </div>
    <script async src="https://js.stripe.com/v3/buy-button.js"></script>
</body>
</html>
