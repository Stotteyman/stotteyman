<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="favicon.png">
    <title>Online Store</title>
</head>
<body>
    <header>
        <div class="logo">
            <img src="logo.png" alt="Logo">
        </div>
        <h1 class="title">Online Store</h1>
        <div class="theme-toggle" id="theme-toggle">
            <img src="dark-icon.png" alt="Dark Mode">
        </div>
    </header>
    
    <section class="intro">
        <h2>Welcome to Our Online Store</h2>
        <p>Discover a wide range of items and services for your needs.</p>
    </section>
    
    <section class="grid">
        <!-- Add your item entries here -->
        <div class="item">
            <img src="item1.jpg" alt="Item 1">
            <p class="description">Description for Item 1</p>
        </div>
        <!-- Repeat for other items -->
    </section>
    
    <footer>
        <p>Owned by Stotteyman Enterprises LLC</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
