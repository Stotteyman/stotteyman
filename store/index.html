<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="favicon.png">
    <title>TEST STORE</title>
</head>
<body>
    <header>
        <div class="logo">
            <img src="logo.png" alt="Logo">
        </div>
        <h1 class="title">JAYFLY</h1>
        <div class="theme-toggle" id="theme-toggle">
            <img src="dark-icon.png" alt="Dark Mode">
        </div>
    </header>
    
    <main>
        <div class="grid">
            <!-- Add your item entries here -->
            <div class="item">
                <img src="item1.jpg" alt="Item 1">
                <p class="description">Custom Youtube Thumbnails</p>
            </div>
            <!-- Repeat for other items -->
        </div>
    </main>
    
    <footer>
        Owned by Stotteyman Enterprises LLC
    </footer>

    <script src="script.js"></script>
</body>
</html>
