<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:title" content="Stotteyman.com">
    <meta property="og:description" content="Explore the world of Stotteyman">
    <meta property="og:image" content="https://www.stotteyman.com/images/stotteyman.ico">
    <meta property="og:image:type" content="image/x-icon">
    <meta property="og:url" content="https://www.stotteyman.com">
    <link rel="shortcut icon" href="images/stotteyman.ico" type="image/x-icon">
    <title>Stotteyman.com</title>
    <style>
        /* Add the styles for the "Watch Live" button here */
        .watch-live-btn {
            padding: 10px 20px;
            font-size: 18px;
            background-color: #FF9900;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease-in-out;
        }

        .watch-live-btn:hover {
            background-color: #E8800B;
        }

        /* Center align content */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Roboto', sans-serif;
            background-color: #000;
            color: #fff;
        }

        #content {
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="container" id="content">
        <script>
            document.addEventListener('DOMContentLoaded', function () {
                const content = document.getElementById('content');

                // Function to create an entrance animation
                function animateEntrance() {
                    content.style.opacity = '0'; // Initially hide the content

                    // Add entrance animation here (e.g., fade in)
                    content.style.transition = 'opacity 1s ease-in-out';
                    setTimeout(() => {
                        content.style.opacity = '1';
                    }, 1000); // 1000 milliseconds delay
                }

                // Function to load livestream on button click
                function loadLivestream() {
                    window.open('https://kick.com/stotteyman', '_blank');
                }

                // Create "Watch Live" button
                function createWatchLiveButton() {
                    const watchLiveButton = document.createElement('button');
                    watchLiveButton.textContent = 'Watch Live';
                    watchLiveButton.classList.add('watch-live-btn');
                    watchLiveButton.addEventListener('click', loadLivestream);
                    content.appendChild(watchLiveButton);
                }

                // Animate entrance and create "Watch Live" button
                animateEntrance();
                createWatchLiveButton();
            });
        </script>
    </div>
</body>

</html>
