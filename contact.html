<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="Ways to contact stotteyman" />
  <title>Contact | stotteyman</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a href="/" class="logo">stotteyman.com</a>
      <nav>
        <ul>
          <li><a href="/">Home</a></li>
          <li><a href="/blog/">Blog</a></li>
          <li><a href="/contact.html">Contact</a></li>
          <li><a href="/discord.html">Discord</a></li>
        </ul>
      </nav>
    </div>
  </header>
  <main class="container">
    <h1 style="text-align:center;color:var(--accent-color)">📇 Contact stotteyman</h1>
    <dl class="card">
      <dt>Phone</dt><dd>+1 661 597 2210</dd>
      <dt>Email</dt><dd>contact@stotteyman.com</dd>
    </dl>

    <div class="card" style="text-align:center">
      <a id="vcardBtn" class="action" download="stotteyman.vcf">➕ Add to Contacts</a>
      <button onclick="shareContact()">🔗 Share Contact</button>
      <a class="action" href="tel:+16615972210">📞 Call</a>
      <a class="action" href="facetime:+16615972210">📹 FaceTime</a>
    </div>

    <div class="card" style="text-align:center">
      <a class="action" href="https://www.instagram.com/stotteymantv" target="_blank">📷 DM Me on Instagram</a>
      <a class="action" href="https://discord.com/users/stotteyman" target="_blank">🎮 Add Me on Discord</a>
      <a class="action" href="https://www.youtube.com/@stotteyman" target="_blank">📺 Subscribe on YouTube</a>
    </div>
  </main>
  <script>
const vcardData = `BEGIN:VCARD\nVERSION:3.0\nN:Stotteyman;;;;\nFN:stotteyman\nTEL;TYPE=CELL:+1-661-597-2210\nEMAIL;TYPE=INTERNET:contact@stotteyman.com\nEND:VCARD`;

document.getElementById('vcardBtn').href =
  'data:text/vcard;charset=utf-8,' + encodeURIComponent(vcardData);

async function shareContact() {
  try {
    const blob = new Blob([vcardData], { type: 'text/vcard' });
    const file = new File([blob], 'stotteyman.vcf', { type: 'text/vcard' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({
        title: 'Contact stotteyman',
        text: "Save stotteyman's contact info",
        files: [file]
      });
    } else {
      alert('Sharing contact file not supported on this device.');
    }
  } catch (error) {
    alert('Error sharing contact file.');
    console.error(error);
  }
}
  </script>
  <footer class="site-footer">
    <p>&copy; 2024 stotteyman.com</p>
  </footer>
</body>
</html>
