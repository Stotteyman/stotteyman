    <link rel="stylesheet" href="./style.css" />
    <div>
      <link href="./contact.css" rel="stylesheet" />

      <div class="contact-container">
        <div class="contact-contact">
          <div class="contact-top-bar">
            <img
              src="public/external/rectangle41371330-0is-200h.png"
              alt="Rectangle41371330"
              class="contact-rectangle4137"
            />
            <a href="index.html" class="contact-text">
              <span>Stotteyman.com</span>
            </a>
            <div class="contact-navigation">
              <a href="projects.html" class="contact-text02">
                <span>Projects</span>
              </a>
              <a href="contact.html" class="contact-text04">
                <span>Contact</span>
              </a>
              <a href="donate.html" class="contact-text06">
                <span>Donate</span>
              </a>
            </div>
          </div>
            <div class="contact-section">
              <div class="contact-container1">
                <span class="contact-text08"><span>Contact</span></span>
              
                <!-- Name Input -->
                <div class="contact-input">
                  <span class="contact-text10"><span>Name</span></span>
                  <div class="contact-textfield" id="nameField" onclick="handleClick('nameField')">
                    <span class="contact-text12">
                      <span>Enter your name</span>
                    </span>
                  </div>
                </div>
              
                <!-- Email Input -->
                <div class="contact-input1">
                  <span class="contact-text14"><span>Email</span></span>
                  <div class="contact-textfield1" id="emailField" onclick="handleClick('emailField')">
                    <span class="contact-text16">
                      <span>Enter your email address</span>
                    </span>
                  </div>
                </div>
              
                <!-- Message Input -->
                <div class="contact-input2">
                  <span class="contact-text18"><span>Message</span></span>
                  <div class="contact-textfield2" id="messageField" onclick="handleClick('messageField')">
                    <span class="contact-text20">
                      <span>Enter your message</span>
                    </span>
                  </div>
                </div>
              
                <!-- Button -->
                <button class="contact-button">
                  <div class="contact-seconday">
                    <span class="contact-text22"><span>Cancel</span></span>
                  </div>
                  <div class="contact-primary">
                    <span class="contact-text24" onclick="sendMessage()"><span>Send</span></span>
                  </div>
                </button>
              </div>
            </div>
            <script>
              function handleClick(fieldId) {
                const field = document.getElementById(fieldId);
                field.innerHTML = '<input type="text" />';
              }
            
              function sendMessage() {
                // Validate email address
                const emailField = document.getElementById('emailField');
                const emailInput = emailField.querySelector('input');
                const emailValue = emailInput.value.trim();
            
                // Basic email validation
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if (!emailRegex.test(emailValue)) {
                  alert('Please enter a valid email address.');
                  return;
                }
            
                // Perform further actions or submit the form
                // ...
            
                // For now, let's log the input values
                console.log('Name:', document.getElementById('nameField').querySelector('input').value.trim());
                console.log('Email:', emailValue);
                console.log('Message:', document.getElementById('messageField').querySelector('input').value.trim());
              }
            </script>     

            <img
              src="public/external/vector2009245-rq5a.svg"
              alt="Vector2009245"
              class="contact-vector200"
            />
          </div>
          <div class="contact-section1">
            <div class="contact-avatar"></div>
            <div class="contact-container2">
              <span class="contact-text26">
                <span>Gary Lee McCullouch</span>
              </span>
            </div>
            <img

              alt="Vector2009250"

          </div>

              <span class="contact-text29">
