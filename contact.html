<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Contact | stotteyman</title>
  <style>
    body { font-family: sans-serif; background: #fafafa; max-width: 680px; margin: auto; padding: 1rem; }
    h1 { text-align: center; color: #ff6600; }
    .card { background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.1); padding: 1.2rem; margin: 1rem 0; }
    dt { font-weight: 600; margin-top: .6rem; }
    dd { margin: 0 0 .4rem 0; }
    button, a.action {
      display: inline-block;
      margin: .4rem .3rem;
      padding: .6rem 1.1rem;
      border: none;
      border-radius: 4px;
      background: #ff6600;
      color: #fff;
      text-decoration: none;
      cursor: pointer;
      font-size: .93rem;
    }
    button:disabled {
      background: #999;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

<h1>📇 Contact stotteyman</h1>

<dl class="card">
  <dt>Phone</dt><dd>+1 661 597 2210</dd>
  <dt>Email</dt><dd>contact@stotteyman.com</dd>
</dl>

<div class="card" style="text-align:center">
  <a id="vcardBtn" class="action" download="stotteyman.vcf">➕ Add to Contacts</a>
  <button onclick="shareContact()">🔗 Share Contact</button>
  <a class="action" href="tel:+16615972210">📞 Call</a>
  <a class="action" href="facetime:+16615972210">📹 FaceTime</a>
</div>

<script>
const vcard = `
BEGIN:VCARD
VERSION:3.0
N:Stotteyman;;;;
FN:stotteyman
TEL;TYPE=CELL:+1-661-597-2210
EMAIL;TYPE=INTERNET:contact@stotteyman.com
END:VCARD
`.trim();

// Add to Contacts button
document.getElementById('vcardBtn').href =
  'data:text/vcard;charset=utf-8,' + encodeURIComponent(vcard);

// Share .vcf file using Web Share API with Files (iOS Safari supported)
async function shareContact() {
  try {
    const blob = new Blob([vcard], { type: 'text/vcard' });
    const file = new File([blob], "stotteyman.vcf", { type: "text/vcard" });

    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({
        title: "Contact stotteyman",
        text: "Save stotteyman's contact info",
        files: [file]
      });
    } else {
      alert('Sharing contact file not supported on this device.');
    }
  } catch (error) {
    alert('Error sharing contact file.');
    console.error(error);
  }
}
</script>

</body>
</html>
