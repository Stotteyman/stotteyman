<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Azoa Music</title>
  <style>
    body {
      font-family: 'Courier New', monospace;
      background-color: #0a0a0a;
      color: #e0e0e0;
      margin: 0;
      padding: 0;
    }
    header {
      background: linear-gradient(to bottom, #111, #000);
      padding: 2rem;
      text-align: center;
      border-bottom: 2px solid #444;
    }
    h1 {
      font-size: 2.5rem;
      color: #ffffff;
      font-weight: bold;
      letter-spacing: 3px;
      text-shadow: 0 0 10px #666;
    }
    main {
      padding: 2rem 1rem;
      max-width: 800px;
      margin: auto;
    }
    .release {
      background: #151515;
      padding: 1.5rem;
      margin-bottom: 2rem;
      border-radius: 6px;
      border-left: 3px solid #888;
    }
    .release h2 {
      color: #fff;
      margin-bottom: 0.5rem;
      font-size: 1.5rem;
    }
    .release p {
      margin: 0.5rem 0;
      color: #ccc;
      font-size: 1rem;
    }
    .release a {
      color: #ff66cc;
      text-decoration: underline;
    }
    iframe {
      width: 100%;
      max-width: 100%;
      height: 315px;
      border: none;
    }
    footer {
      background-color: #0a0a0a;
      text-align: center;
      padding: 1.5rem;
      border-top: 2px solid #444;
    }
    a {
      color: #bbb;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <header>
    <h1>AZOA</h1>
    <p>Explore the sound of Azoa</p>
  </header>

  <main>
    <!-- NEW RELEASE SECTION START -->
    <div class="release">
      <h2>New Track: "Life"</h2>
      <p>Released: June 1, 2025</p>
      <p><a href="https://music.youtube.com/watch?v=1nUNrF66c_w&si=vTeOdsfDo_6RJut5" target="_blank">Listen Now</a></p>
      <div style="margin-top:1rem">
        <iframe src="https://www.youtube.com/embed/1nUNrF66c_w" title="Life by Azoa" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
      </div>
    </div>
    <!-- COPY ABOVE BLOCK TO ADD MORE RELEASES -->
  </main>

  <footer>
    <p>Contact: <a href="mailto:azoa@stotteyman.com">azoa@stotteyman.com</a></p>
  </footer>
</body>
</html>
