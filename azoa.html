<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Azoa Music</title>
  <style>
    body {
      font-family: 'Courier New', monospace;
      background-color: #0a0a0a;
      color: #e0e0e0;
      margin: 0;
      padding: 0;
    }
    header {
      background: linear-gradient(to bottom, #111, #000);
      padding: 2rem;
      text-align: center;
      border-bottom: 2px solid #444;
    }
    h1 {
      font-size: 2.5rem;
      color: #ffffff;
      font-weight: bold;
      letter-spacing: 3px;
      text-shadow: 0 0 10px #666;
    }
    main {
      padding: 2rem;
    }
    .track-embed {
      margin: 2rem auto;
      max-width: 560px;
      display: flex;
      justify-content: center;
    }
    footer {
      background-color: #0a0a0a;
      text-align: center;
      padding: 1.5rem;
      border-top: 2px solid #444;
    }
    a {
      color: #bbb;
      text-decoration: underline;
    }

<body>
  <header>
    <h1>AZOA</h1>
    <p>Dark. Emotional. Real. Explore the sound of Azoa.</p>
  </header>

  <main>
    <div class="track-embed">
      <iframe width="100%" height="315" src="https://www.youtube.com/embed?listType=user_uploads&list=UC19na4aLpUPW7ivISqRp_Rg" title="Azoa Music" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>

  <footer>
    <p>Contact: <a href="mailto:azoa@stotteyman.com">azoa@stotteyman.com</a></p>
