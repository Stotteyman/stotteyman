<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#000000"/>
  
  <!-- Subtle pattern -->
  <defs>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.5" fill="#ffffff" opacity="0.03"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#dots)"/>
  
  <!-- Blog icon -->
  <g transform="translate(200, 200)">
    <rect x="-60" y="-40" width="120" height="80" fill="none" stroke="#ffffff" stroke-width="3" rx="8"/>
    <line x1="-40" y1="-20" x2="40" y2="-20" stroke="#ffffff" stroke-width="2"/>
    <line x1="-40" y1="0" x2="20" y2="0" stroke="#ffffff" stroke-width="2"/>
    <line x1="-40" y1="20" x2="30" y2="20" stroke="#ffffff" stroke-width="2"/>
  </g>
  
  <!-- Main text -->
  <text x="600" y="300" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="72" font-weight="300">
    Blog
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="380" text-anchor="middle" fill="#888888" font-family="system-ui, sans-serif" font-size="28" font-weight="300">
    Thoughts on design, technology, and the creative process
  </text>
  
  <!-- Author -->
  <text x="600" y="450" text-anchor="middle" fill="#666666" font-family="system-ui, sans-serif" font-size="20">
    by Stotteyman
  </text>
  
  <!-- Accent line -->
  <line x1="400" y1="490" x2="800" y2="490" stroke="#ffffff" stroke-width="2"/>
  
  <!-- Bottom tagline -->
  <text x="600" y="530" text-anchor="middle" fill="#666666" font-family="system-ui, sans-serif" font-size="18">
    Minimal • Insightful • Authentic
  </text>
</svg>
