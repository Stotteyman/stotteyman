<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#000000"/>
  
  <!-- Subtle grid pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>
  
  <!-- Main logo -->
  <g transform="translate(600, 200)">
    <circle cx="0" cy="0" r="80" fill="#000000" stroke="#ffffff" stroke-width="3"/>
    <path d="M-40 -30 Q-40 -60 -10 -60 Q20 -60 20 -30 Q20 0 -10 0 Q-40 0 -40 30" 
          stroke="#ffffff" 
          stroke-width="12" 
          fill="none" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    <circle cx="50" cy="50" r="8" fill="#ffffff"/>
  </g>
  
  <!-- Main text -->
  <text x="600" y="380" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="64" font-weight="300" letter-spacing="2px">
    Stotteyman
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="450" text-anchor="middle" fill="#888888" font-family="system-ui, sans-serif" font-size="24" font-weight="300">
    Life is what you make it
  </text>
  
  <!-- Accent line -->
  <line x1="500" y1="490" x2="700" y2="490" stroke="#ffffff" stroke-width="2"/>
  
  <!-- Bottom tagline -->
  <text x="600" y="530" text-anchor="middle" fill="#666666" font-family="system-ui, sans-serif" font-size="18" font-weight="300">
    Minimal • Creative • Intentional
  </text>
</svg>