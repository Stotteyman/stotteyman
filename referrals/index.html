<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Freebies, deals, promos & more!</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon" />
  <style>
    :root {
      color-scheme: light dark;
    }
    body {
      font-family: sans-serif;
      background: #f4f4f4;
      padding: 1em;
      max-width: 800px;
      margin: auto;
      color: black;
    }
    @media (prefers-color-scheme: dark) {
      body {
        background: #1e1e1e;
        color: white;
      }
      .card {
        background: #ffffff;
        color: black;
        box-shadow: 0 1px 3px rgba(255,255,255,0.05);
      }
    }
    .card {
      background: white;
      border-radius: 8px;
      padding: 1em;
      margin: .75em 0;
      box-shadow: 0 1px 3px rgba(0,0,0,.1);
    }
    h1 {
      text-align: center;
      color: #ff6600;
      margin-bottom: .5em;
    }
    h2 {
      margin-top: 1.5em;
    }
    .buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: .5em;
    }
    .buttons a,
    .buttons button {
      padding: .5em 1em;
      border-radius: 4px;
      text-decoration: none;
      color: white;
      background: #ff6600;
      border: none;
      cursor: pointer;
      font-size: 0.9em;
    }
    .buttons button:disabled {
      background: #999;
      cursor: not-allowed;
    }
    .modal {
      display: none;
      position: fixed;
      z-index: 999;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgba(0, 0, 0, 0.8);
    }
    .modal-content {
      background-color: #fff;
      margin: 15% auto;
      padding: 20px;
      border: 1px solid #888;
      width: 90%;
      max-width: 400px;
      color: black;
      border-radius: 8px;
    }
    .close {
      color: #aaa;
      float: right;
      font-size: 28px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>💸 Freebies, deals, promos & more!</h1>
  <div id="content">Loading…</div>

  <div id="infoModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeModal()">&times;</span>
      <p id="infoText">No info available</p>
    </div>
  </div>

  <script>
    const SHEET_ID = '19rRwlvb4V64NolwwDwRoh5NysDhSMr5Z';
    const TABS = [
      'Banking',
      'Cashback Rewards',
      'Casino',
      'Crypto'
    ];

    async function fetchTab(tabName) {
      const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?sheet=${encodeURIComponent(tabName)}&tqx=out:json`;
      const res = await fetch(url);
      const text = await res.text();
      const json = JSON.parse(text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1));
      return json.table.rows;
    }

    function shareLink(title, text, url) {
      if (navigator.share) {
        navigator.share({ title, text, url }).catch(() => {});
      } else {
        alert("Sharing not supported on this device.");
      }
    }

    function showInfo(name) {
      document.getElementById('infoText').innerText = `No info available for "${name}"`;
      document.getElementById('infoModal').style.display = 'block';
    }

    function closeModal() {
      document.getElementById('infoModal').style.display = 'none';
    }

    window.onclick = function(event) {
      const modal = document.getElementById('infoModal');
      if (event.target === modal) {
        modal.style.display = 'none';
      }
    }

    (async () => {
      const container = document.getElementById('content');
      container.innerHTML = '';
      for (const tab of TABS) {
        try {
          const rows = await fetchTab(tab);
          if (!rows.length) continue;

          const section = document.createElement('section');
          section.innerHTML = `<h2>${tab}</h2>`;

          rows.slice(1).forEach(r => {
            const cells = r.c;
            const name = cells[0]?.v?.trim();
            const desc = cells[1]?.v?.trim() || '';
            const link = cells[2]?.v?.trim();

            if (!name || !link) return;

            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
              <strong>${name}</strong><br>${desc}
              <div class="buttons">
                <a href="${link}" target="_blank">Sign Up</a>
                <button onclick="shareLink('${name}', '${desc}', '${link}')">Share</button>
                <button onclick="showInfo('${name}')">Info</button>
              </div>
            `;
            section.appendChild(card);
          });

          container.appendChild(section);
        } catch (e) {
          console.error(`Error loading tab: ${tab}`, e);
        }
      }
    })();
  </script>
</body>
</html>
