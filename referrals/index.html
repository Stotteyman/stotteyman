<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Freebies, deals, promos & more!</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon" />
  <style>
    body {
      font-family: sans-serif;
      background: #f4f4f4;
      padding: 1em;
      max-width: 800px;
      margin: auto;
    }
    h1 {
      text-align: center;
      color: #ff6600;
      margin-bottom: .5em;
    }
    h2 {
      margin-top: 1.5em;
    }
    .card {
      background: white;
      border-radius: 8px;
      padding: 1em;
      margin: .75em 0;
      box-shadow: 0 1px 3px rgba(0,0,0,.1);
    }
    .buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: .5em;
    }
    .buttons a,
    .buttons button {
      padding: .5em 1em;
      border-radius: 4px;
      text-decoration: none;
      color: white;
      background: #ff6600;
      border: none;
      cursor: pointer;
      font-size: 0.9em;
    }
    .buttons button:disabled {
      background: #999;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <h1>💸 Freebies, deals, promos & more!</h1>
  <div id="content">Loading…</div>

  <script>
    const SHEET_ID = '19rRwlvb4V64NolwwDwRoh5NysDhSMr5Z';
    const TABS = [
      'Free Money',
      'Cashback & Investing',
      'Crypto',
      'Casino',
      'Rewards'
    ];

    async function fetchTab(tabName) {
      const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?sheet=${encodeURIComponent(tabName)}&tqx=out:json`;
      const res = await fetch(url);
      const text = await res.text();
      const json = JSON.parse(text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1));
      return json.table.rows;
    }

    function shareLink(title, text, url) {
      if (navigator.share) {
        navigator.share({ title, text, url }).catch(() => {});
      } else {
        alert("Sharing not supported on this device.");
      }
    }

    (async () => {
      const container = document.getElementById('content');
      container.innerHTML = '';
      for (const tab of TABS) {
        try {
          const rows = await fetchTab(tab);
          if (!rows.length) continue;

          const section = document.createElement('section');
          section.innerHTML = `<h2>${tab}</h2>`;

          rows.slice(1).forEach(r => {
            const [nameCell, descCell, linkCell] = r.c;
            const name = nameCell?.v;
            const desc = descCell?.v || '';
            const link = linkCell?.v;

            if (!name || !link) return;

            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
              <strong>${name}</strong><br>${desc}
              <div class="buttons">
                <a href="${link}" target="_blank">Sign Up</a>
                <button onclick="shareLink('${name}', '${desc}', '${link}')">Share</button>
              </div>
            `;
            section.appendChild(card);
          });

          container.appendChild(section);
        } catch (e) {
          console.error(`Error loading tab: ${tab}`, e);
        }
      }
    })();
  </script>
</body>
</html>
