<html>
  <head>
	<style>
		.container {
		  width: 500px;
		  height: 500px;
		  display: flex;
		  justify-content: center;
		  align-items: center;
		  border: 1px solid black;
		}
	  </style>
    <script src="https://cdn.jsdelivr.net/npm/web3@1.3.0/dist/web3.min.js"></script>
    <script>
      window.addEventListener('load', async () => {
        if (typeof web3 !== 'undefined') {
          web3 = new Web3(web3.currentProvider);
        } else {
          alert('Please install a Web3 provider such as Metamask or Brave.');
        }

        const contractAddress = '0xD04449B411bAF44383BC1B021A65c1dcfb3CFe5e';
        const abi = [
	{
		"inputs": [
			{
				"internalType": "address",
				"name": "usdcContractAddress",
				"type": "address"
			}
		],
		"stateMutability": "nonpayable",
		"type": "constructor"
	},
	{
		"inputs": [
			{
				"internalType": "uint256",
				"name": "USDC",
				"type": "uint256"
			}
		],
		"name": "fund",
		"outputs": [],
		"stateMutability": "payable",
		"type": "function"
	},
	{
		"inputs": [],
		"name": "owner",
		"outputs": [
			{
				"internalType": "address",
				"name": "",
				"type": "address"
			}
		],
		"stateMutability": "view",
		"type": "function"
	},
	{
		"inputs": [],
		"name": "usdc",
		"outputs": [
			{
				"internalType": "contract USDC",
				"name": "",
				"type": "address"
			}
		],
		"stateMutability": "view",
		"type": "function"
	}
];
        const contract = new web3.eth.Contract(abi, contractAddress);

    web3.eth.getAccounts().then((accounts) => {
      const account = accounts[0];
      if (account) {
        document.getElementById('account-address').innerText = account;
        document.getElementById('connect-wallet-button').style.display = 'none';
      } else {
        document.getElementById('connect-wallet-button').style.display = 'block';
      }

      document.getElementById('donate-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        const amount = document.getElementById('donate-amount').value;
        contract.methods.fund(amount).send({ from: account });
      });
      
      document.getElementById('donate-10-button').addEventListener('click', async (event) => {
        event.preventDefault();
        contract.methods.fund(10).send({ from: account });
      });
      
      document.getElementById('donate-20-button').addEventListener('click', async (event) => {
        event.preventDefault();
        contract.methods.fund(20).send({ from: account });
      });
      
      document.getElementById('donate-50-button').addEventListener('click', async (event) => {
        event.preventDefault();
        contract.methods.fund(50).send({ from: account });
      });
      
      document.getElementById('donate-100-button').addEventListener('click', async (event) => {
        event.preventDefault();
        contract.methods.fund(100).send({ from: account });
      });
    });
  });
</script>
  </head>
  <body>
	<div style="display:flex; justify-content:center; align-items:center; height:100vh">
	  <div style="border:1px solid black; padding:20px; width:400px">
		<div id="account-address" style="text-align:center"></div>
		<button id="connect-wallet-button" style="display:none; margin:10px auto; width:150px; height:30px; background-color:blue; color:white; border:none" onclick="ethereum.enable()">Connect Wallet</button>
		<form id="donate-form">
		  <input type="text" id="donate-amount" style="margin:10px auto; width:150px; height:30px; padding:5px">
		  <input type="submit" value="Donate" style="margin:10px auto; width:150px; height:30px; background-color:blue; color:white; border:none">
		</form>
		<button id="donate-10-button" style="margin:10px auto; width:150px; height:30px; background-color:blue; color:white; border:none">Donate 10</button>
		<button id="donate-20-button" style="margin:10px auto; width:150px; height:30px; background-color:blue; color:white; border:none">Donate 20</button>
		<button id="donate-50-button" style="margin:10px auto; width:150px; height:30px; background-color:blue; color:white; border:none">Donate 50</button>
		<button id="donate-100-button" style="margin:10px auto; width:150px; height:30px; background-color:blue; color:white; border:none">Donate 100</button>
	  </div>
	</div>
  </body>
  
</html>
