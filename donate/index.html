<!DOCTYPE html>
<html>
<head>
  <title>Donation Page</title>
  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/web3@1.0.0-beta.37/dist/web3.min.js"></script>
</head>
<body>
  <h1>Donate with USDC</h1>
  <p>Choose an amount to donate:</p>
  <button id="donate1">$1</button>
  <button id="donate10">$10</button>
  <button id="donate100">$100</button>
  <p>or enter a custom amount:</p>
  <input type="text" id="customAmount">
  <button id="donateCustom">Donate</button>
  <script>
    if (typeof web3 !== 'undefined') {
      web3 = new Web3(web3.currentProvider);
    } else {
      alert("Please install MetaMask and refresh the page");
    }

    const usdcAddress = "0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48";
    const donationsAddress = "0x...";
    const usdcContract = new web3.eth.Contract(USDC_ABI, usdcAddress);
    const donationsContract = new web3.eth.Contract(Donations_ABI, donationsAddress);

    $("#donate1").click(function() {
      donate(1);
    });

    $("#donate10").click(function() {
      donate(10);
    });

    $("#donate100").click(function() {
      donate(100);
    });

    $("#donateCustom").click(function() {
      donate($("#customAmount").val());
    });

    async function donate(amount) {
      const USDCAmount = amount * 10 ** 6;
      const accounts = await web3.eth.getAccounts();
      const spender = accounts[0];
      const allowance = await usdcContract.methods.allowance(spender, donationsAddress).call();
      if (allowance < USDCAmount) {
        await usdcContract.methods.approve(donationsAddress, USDCAmount).send({
          from: spender
        });
      }
      donationsContract.methods.donate(amount).send({
        from: spender
      });
    }
  </script>
</body>
</html>
