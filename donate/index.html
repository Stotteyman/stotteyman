async function fund() {
  const USDC = document.getElementById("USDC").value;
  const usdcBalance = await usdcContract.methods.balanceOf(address[0]).call();

  // check if the user has enough USDC
  if (usdcBalance < USDC) {
    alert("Not enough USDC");
    return;
  }

  // approve the contract to use USDC on behalf of the user
  await usdcContract.methods.approve(contractAddress, USDC).send({ from: address[0] });

  // call the fund method on the contract
  await contract.methods.fund(USDC).send({ from: address[0] });

  alert("Transaction complete!");
}

          document.getElementById('donate-form').addEventListener('submit', async (event) => {

            const amount = document.getElementById('donate-amount').value;
