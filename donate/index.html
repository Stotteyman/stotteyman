<html>
  <head>
    <style>
      .container {
        background-color: orange;
        width: 50%;
        height: auto;
        margin: 0 auto;
        padding: 20px;
        border-radius: 10px;
      }

      .title {
        font-size: 24px;
        font-weight: bold;
        margin-bottom: 20px;
      }

      #account-address {
        font-size: 18px;
        margin-bottom: 20px;
      }

      #connect-wallet-button {
        background-color: white;
        color: orange;
        border: 1px solid orange;
        border-radius: 10px;
        padding: 10px 20px;
        margin-top: 20px;
        display: none;
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/web3@1.3.0/dist/web3.min.js"></script>
    <script>
      window.addEventListener('load', async () => {
        if (typeof web3 !== 'undefined') {
          web3 = new Web3(web3.currentProvider);
        } else {
          document.getElementById('connect-wallet-button').style.display = 'block';
        }

        const contractAddress = '0xD04449B411bAF44383BC1B021A65c1dcfb3CFe5e';
        const abi = [
	{
		"inputs": [
			{
				"internalType": "address",
				"name": "usdcContractAddress",
				"type": "address"
			}
		],
		"stateMutability": "nonpayable",
		"type": "constructor"
	},
	{
		"inputs": [
			{
				"internalType": "uint256",
				"name": "USDC",
				"type": "uint256"
			}
		],
		"name": "fund",
		"outputs": [],
		"stateMutability": "payable",
		"type": "function"
	},
	{
		"inputs": [],
		"name": "owner",
		"outputs": [
			{
				"internalType": "address",
				"name": "",
				"type": "address"
			}
		],
		"stateMutability": "view",
		"type": "function"
	},
	{
		"inputs": [],
		"name": "usdc",
		"outputs": [
			{
				"internalType": "contract USDC",
				"name": "",
				"type": "address"
			}
		],
		"stateMutability": "view",
		"type": "function"
	}
];
        const contract = new web3.eth.Contract(abi, contractAddress);

        web3.eth.getAccounts().then((accounts) => {
          const account = accounts[0];
          if (account) {
            document.getElementById('account-address').innerText = account;
            document.getElementById('connect-wallet-button').style.display = 'none';
          } else {
            document.getElementById('connect-wallet-button').style.display = 'block';
          }

          document.getElementById('donate-form').addEventListener('submit', async (event) => {
            event.preventDefault();
            const amount = document.getElementById('donate-amount').value;
            contract.methods.fund(amount).send({ from: account });
          });

          document.getElementById('donate-10-button').addEventListener('click', async () => {
            contract.methods.fund(10).send({ from: account });
          });

          document.getElementById('donate-20-button').addEventListener('click', async () => {
            contract.methods.fund(20).send({ from: account });
          });

          document.getElementById('donate-50-button').addEventListener('click', async () => {
            contract.methods.fund(50).send({ from: account });
          });

          document.getElementById('donate-100-button').addEventListener('click', async () => {
            contract.methods.fund(100).send({ from: account });
          });
        });
      });
    </script>
  </head>
  <body>
	<div style="background-color: #FFA500; padding: 20px; text-align: center; width: 400px; margin: 20px auto; box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19);">
	  <h2>Make a Donation</h2>
	  <div id="account-address" style="color: #fff; font-weight: bold;">
		<p>Your Address</p>
	  </div>
	  <button id="connect-wallet-button" style="background-color: #333; color: #fff; padding: 10px 20px; margin-top: 20px; border-radius: 10px; font-weight: bold; display: none;">Connect Wallet</button>
	  <form id="donate-form" style="margin-top: 40px;">
		<p style="color: #fff;">Custom Amount</p>
		<input type="text" id="donate-amount" style="background-color: #fff; padding: 10px 20px; margin-top: 20px; border-radius: 10px;">
		<input type="submit" value="Donate" style="background-color: #333; color: #fff; padding: 10px 20px; margin-top: 20px; border-radius: 10px; font-weight: bold;">
	  </form>
	  <h3 style="color: #fff; margin-top: 40px;">Quick Pay</h3>
	  <button style="background-color: #333; color: #fff; padding: 10px 20px; margin-top: 20px; border-radius: 10px; font-weight: bold;">Donate 10 USDC</button>
	  <button style="background-color: #333; color: #fff; padding: 10px 20px; margin-top: 20px; border-radius: 10px; font-weight: bold;">Donate 20 USDC</button>
	  <button style="background-color: #333; color: #fff; padding: 10px 20px; margin-top: 20px; border-radius: 10px; font-weight: bold;">Donate 50 USDC</button>
	  <button style="background-color: #333; color: #fff; padding: 10px 20px; margin-top: 20px; border-radius: 10px; font-weight: bold;">Donate 100 USDC</button>
	</div>
  </body>
  
</html>
