<html>
  <head>
	<style>
		.container {
		  width: 500px;
		  height: 500px;
		  display: flex;
		  justify-content: center;
		  align-items: center;
		  border: 1px solid black;
		}
	  </style>
    <script src="https://cdn.jsdelivr.net/npm/web3@1.3.0/dist/web3.min.js"></script>
    <script>
      window.addEventListener('load', async () => {
        if (typeof web3 !== 'undefined') {
          web3 = new Web3(web3.currentProvider);
        } else {
          alert('Please install a Web3 provider such as Metamask or Brave.');
        }

        const contractAddress = '0xD04449B411bAF44383BC1B021A65c1dcfb3CFe5e';
        const abi = [
	{
		"inputs": [
			{
				"internalType": "address",
				"name": "usdcContractAddress",
				"type": "address"
			}
		],
		"stateMutability": "nonpayable",
		"type": "constructor"
	},
	{
		"inputs": [
			{
				"internalType": "uint256",
				"name": "USDC",
				"type": "uint256"
			}
		],
		"name": "fund",
		"outputs": [],
		"stateMutability": "payable",
		"type": "function"
	},
	{
		"inputs": [],
		"name": "owner",
		"outputs": [
			{
				"internalType": "address",
				"name": "",
				"type": "address"
			}
		],
		"stateMutability": "view",
		"type": "function"
	},
	{
		"inputs": [],
		"name": "usdc",
		"outputs": [
			{
				"internalType": "contract USDC",
				"name": "",
				"type": "address"
			}
		],
		"stateMutability": "view",
		"type": "function"
	}
];
        const contract = new web3.eth.Contract(abi, contractAddress);

    web3.eth.getAccounts().then((accounts) => {
      const account = accounts[0];
      if (account) {
        document.getElementById('account-address').innerText = account;
        document.getElementById('connect-wallet-button').style.display = 'none';
      } else {
        document.getElementById('connect-wallet-button').style.display = 'block';
      }

      document.getElementById('donate-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        const amount = document.getElementById('donate-amount').value;
        contract.methods.fund(amount).send({ from: account });
      });
      
      document.getElementById('donate-10-button').addEventListener('click', async (event) => {
        event.preventDefault();
        contract.methods.fund(10).send({ from: account });
      });
      
      document.getElementById('donate-20-button').addEventListener('click', async (event) => {
        event.preventDefault();
        contract.methods.fund(20).send({ from: account });
      });
      
      document.getElementById('donate-50-button').addEventListener('click', async (event) => {
        event.preventDefault();
        contract.methods.fund(50).send({ from: account });
      });
      
      document.getElementById('donate-100-button').addEventListener('click', async (event) => {
        event.preventDefault();
        contract.methods.fund(100).send({ from: account });
      });
    });
  });
</script>
  </head>
  <body>
	<div id="body-box" style="width: 500px; margin: 0 auto;">
	  <h3 style="text-align: center;">Make a Donation</h3>
	  <div id="account-address-box">
		<h4>Your Address:</h4>
		<div id="account-address"></div>
	  </div>
	  <form id="donate-form">
		<h4>Custom Amount:</h4>
		<input type="text" id="donate-amount">
		<input type="submit" value="Donate">
		<h4>Quick Pay:</h4>
		<button id="donate-10-button" value="10">Donate 10</button>
		<button id="donate-20-button" value="20">Donate 20</button>
		<button id="donate-50-button" value="50">Donate 50</button>
		<button id="donate-100-button" value="100">Donate 100</button>
	  </form>
	  <button id="connect-wallet-button" style="display:none;" onclick="ethereum.enable()">Connect Wallet</button>
	</div>
  </body>
  
</html>
