<html>
  <head>
    <script src="https://cdn.jsdelivr.net/npm/web3@1.3.0/dist/web3.min.js"></script>
    <script>
      window.addEventListener('load', async () => {
        if (typeof web3 !== 'undefined') {
          web3 = new Web3(web3.currentProvider);
        } else {
          alert('Please install a Web3 provider such as Metamask or Brave.');
        }

        const contractAddress = '0xD04449B411bAF44383BC1B021A65c1dcfb3CFe5e';
        const abi = [
          {
            "inputs": [
              {
                "internalType": "address",
                "name": "usdcContractAddress",
                "type": "address"
              }
            ],
            "payable": false,
            "stateMutability": "nonpayable",
            "type": "constructor"
          },
          {
            "anonymous": false,
            "inputs": [
              {
                "indexed": true,
                "internalType": "address",
                "name": "sender",
                "type": "address"
              },
              {
                "indexed": false,
                "internalType": "uint256",
                "name": "amount",
                "type": "uint256"
              }
            ],
            "name": "Donation",
            "type": "event"
          },
          {
            "constant": false,
            "inputs": [
              {
                "internalType": "uint256",
                "name": "USDC",
                "type": "uint256"
              }
            ],
            "name": "fund",
            "outputs": [],
            "payable": true,
            "stateMutability": "payable",
            "type": "function"
          }
        ];
        const contract = new web3.eth.Contract(abi, contractAddress);

        web3.eth.getAccounts().then((accounts) => {
          const account = accounts[0];
          document.getElementById('account-address').innerText = account;

          document.getElementById('donate-form').addEventListener('submit', async (event) => {
            event.preventDefault();
            const amount = document.getElementById('donate-amount').value;
            contract.methods.fund(amount).send({ from: account });
          });
        });
      });
    </script>
  </head>
  <body>
    <div id="account-address"></div>
    <form id="donate-form">
      <input type="text" id="donate-amount"/>
      <input type="submit" value="Donate"/>
    </form>
    <button id="connect-wallet-button" onclick="ethereum.enable()">Connect Wallet</button>
  </body>
</html>
