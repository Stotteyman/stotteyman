<!DOCTYPE html>
<html>
<head>
  <script src="https://cdn.jsdelivr.net/npm/web3@1.0.0-beta.37/dist/web3.min.js"></script>
  <script>
    // Add your ABI here
    var abi = [
	{
		"inputs": [
			{
				"internalType": "address",
				"name": "usdcContractAddress",
				"type": "address"
			}
		],
		"stateMutability": "nonpayable",
		"type": "constructor"
	},
	{
		"inputs": [
			{
				"internalType": "uint256",
				"name": "USDC",
				"type": "uint256"
			}
		],
		"name": "donate",
		"outputs": [],
		"stateMutability": "payable",
		"type": "function"
	},
	{
		"inputs": [],
		"name": "owner",
		"outputs": [
			{
				"internalType": "address",
				"name": "",
				"type": "address"
			}
		],
		"stateMutability": "view",
		"type": "function"
	},
	{
		"inputs": [],
		"name": "usdc",
		"outputs": [
			{
				"internalType": "contract USDC",
				"name": "",
				"type": "address"
			}
		],
		"stateMutability": "view",
		"type": "function"
	}
];

    // Connect to the contract
    var contractAddress = "0xD04449B411bAF44383BC1B021A65c1dcfb3CFe5e";
    var contract = new web3.eth.Contract(abi, contractAddress);

    // Function to donate with a specified amount
    function donate(amount) {
      contract.methods.donate(amount).send({ from: web3.eth.defaultAccount })
        .then(function (receipt) {
          console.log("Donation successful:", receipt);
        })
        .catch(function (error) {
          console.error("Error making donation:", error);
        });
    }
  </script>
</head>
<body>
  <!-- Donation buttons -->
  <button onclick="donate(1)">Donate 1 USDC</button>
  <button onclick="donate(20)">Donate 20 USDC</button>
  <button onclick="donate(50)">Donate 50 USDC</button>
  <button onclick="donate(100)">Donate 100 USDC</button>
  
  <!-- Custom amount field -->
  <br><br>
  <input id="amount" type="text">
  <button onclick="donate(document.getElementById('amount').value)">Donate Custom Amount</button>
</body>
</html>
