<!DOCTYPE html>
<html>
<head>
  <script src="https://cdn.jsdelivr.net/npm/web3@1.0.0-beta.37/dist/web3.min.js"></script>
  <script>
    // Add your ABI here
    var abi = [
	{
		"inputs": [
			{
				"internalType": "address",
				"name": "usdcContractAddress",
				"type": "address"
			}
		],
		"stateMutability": "nonpayable",
		"type": "constructor"
	},
	{
		"inputs": [
			{
				"internalType": "uint256",
				"name": "USDC",
				"type": "uint256"
			}
		],
		"name": "fund",
		"outputs": [],
		"stateMutability": "payable",
		"type": "function"
	},
	{
		"inputs": [],
		"name": "owner",
		"outputs": [
			{
				"internalType": "address",
				"name": "",
				"type": "address"
			}
		],
		"stateMutability": "view",
		"type": "function"
	},
	{
		"inputs": [],
		"name": "usdc",
		"outputs": [
			{
				"internalType": "contract USDC",
				"name": "",
				"type": "address"
			}
		],
		"stateMutability": "view",
		"type": "function"
	}
];

var contractAddress = "0xD04449B411bAF44383BC1B021A65c1dcfb3CFe5e";
var contract = new web3.eth.Contract(abi, contractAddress);

function fund(amount) {
  contract.methods.donate(amount).send({ from: web3.eth.defaultAccount })
    .then(function (receipt) {
      console.log("Donation successful:", receipt);
    })
    .catch(function (error) {
      console.error("Error making donation:", error);
    });
}

window.addEventListener('load', async () => {
  if (window.ethereum) {
    window.web3 = new Web3(ethereum);
    try {
      await ethereum.enable();
      web3.eth.defaultAccount = (await web3.eth.getAccounts())[0];
    } catch (error) {
      console.error("User denied web3 access");
    }
  }
  else if (window.web3) {
    window.web3 = new Web3(web3.currentProvider);
    web3.eth.defaultAccount = web3.eth.accounts[0];
  }
  else {
    console.error("Non-Ethereum browser detected. You should consider trying MetaMask!");
  }
});
</script>
</head>
<body>
  <button onclick="contract.fund(10)">Donate 10 USDC</button>
  <button onclick="contract.fund(25)">Donate 25 USDC</button>
  <button onclick="contract.fund(50)">Donate 50 USDC</button>
  <button onclick="contract.fund(100)">Donate 100 USDC</button>
<br><br>
<input id="amount" type="number">
<button onclick="contract.fund(document.getElementById('amount').value)">Donate Custom Amount</button>

<br><br>
<button onclick="web3.currentProvider.enable()">Connect Web3 Wallet</button>

</body>
</html>
