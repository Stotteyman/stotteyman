<!DOCTYPE html>
<html>
<head>
	<title>Chat Room Iframe</title>
	<style>
		body {
			background-color: #f2f2f2;
			font-family: Arial, sans-serif;
			font-size: 14px;
		}
		iframe {
			width: 100%;
			height: 600px;
			border: none;
		}
	</style>
</head>
<body>
	<iframe id="chatroom-iframe" src="https://kick.com/stotteyman/chatroom"></iframe>

	<script>
		// Wait for iframe to load
		document.getElementById('chatroom-iframe').onload = function() {
			// Apply custom CSS to the iframe content
			var iframeDoc = document.getElementById('chatroom-iframe').contentDocument;
			iframeDoc.querySelector('.h-full').style.backgroundColor = 'transparent';
			iframeDoc.querySelector('.bg-secondary-dark').style.backgroundColor = 'transparent';
			iframeDoc.querySelector('.border-secondary-lighter').style.borderColor = 'transparent';
			iframeDoc.querySelector('.dark .dark\\:bg-secondary').style.backgroundColor = 'transparent';
			iframeDoc.querySelector('body').style.color = 'white';
			iframeDoc.querySelector('.text-lg').style.visibility = 'hidden';
			iframeDoc.querySelector('.chat-input').style.visibility = 'hidden';
			iframeDoc.querySelector('.bg-secondary-lightest').style.visibility = 'hidden';
			iframeDoc.querySelector('.bg-secondary').style.visibility = 'hidden';
			iframeDoc.querySelector('.bg-secondary-lighter').style.visibility = 'hidden';
			iframeDoc.querySelector('.border-secondary-lighter').style.borderColor = 'transparent';
			iframeDoc.querySelector('.bg-secondary-light').style.visibility = 'hidden';
			iframeDoc.querySelector('.border-secondary-light').style.borderColor = 'transparent';
			iframeDoc.querySelector('.pt-3').style.paddingTop = '0rem';
			iframeDoc.querySelector('.line-clamp-1').style.display = 'none';
			iframeDoc.querySelectorAll('*,:before,:after').forEach(function(el) {
				el.style.borderStyle = 'none';
			});
			iframeDoc.querySelector('.p-2').style.visibility = 'hidden';
			iframeDoc.querySelectorAll('*::-webkit-scrollbar-thumb').forEach(function(el) {
				el.style.visibility = 'hidden';
			});
		};
	</script>
</body>
</html>
