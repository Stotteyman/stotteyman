<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chat Overlay</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: transparent;
        }
        iframe {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            background: transparent;
        }
        /* Transparent background. */
        .h-full {
            background-color: transparent !important;
        }
        .bg-secondary-dark {
            background-color: transparent !important;
        }
        .border-secondary-lighter {
            border-color: transparent !important;
        }
        .dark .dark\:bg-secondary {
            background-color: transparent !important;
        }

        /* Colour of message text. */
        .dark body {
            --tw-text-opacity: 1;
            color: white !important;
        }

        /* Removes the Send a message bar & buttons. */
        .text-lg {
            visibility: hidden !important;
        }
        .chat-input {
            visibility: hidden !important;
        }
        .bg-secondary-lightest {
            visibility: hidden !important;
        }
        .bg-secondary {
            visibility: hidden !important;
        }
        .bg-secondary-lighter {
            visibility: hidden !important;
        }
        .border-secondary-lighter {
            border-color: transparent !important;
        }
        .bg-secondary-light {
            visibility: hidden !important;
        }
        .border-secondary-light {
            border-color: transparent !important;
        }
        .pt-3 {
            padding-top: 0rem;
        }
        .line-clamp-1 {
            display: none !important;
        }
        *, :before, :after {
            border-style: none;
        }
        .p-2 {
            visibility: hidden !important;
        }
        *::-webkit-scrollbar-thumb {
            visibility: hidden !important;
        }
    </style>
</head>
<body>
    <iframe src="https://kick.com/stotteyman/chatroom"></iframe>
</body>
</html>
