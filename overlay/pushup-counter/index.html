<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Pushup Counter</title>
    <style>
      body {
        background-color: #1c1c1c;
        color: #fff;
        font-family: Arial, sans-serif;
        text-align: center;
      }
      h1 {
        margin-top: 50px;
      }
      #pushup-counter {
        font-size: 48px;
        margin-top: 50px;
      }
    </style>
  </head>
  <body>
    <h1>Pushup Counter</h1>
    <p>Pushups to do: <span id="pushup-counter">0</span></p>
    <script>
      const apiEndpoint = 'https://kick.com/api/v1/channels/stotteyman';
      let currentFollowers = 0;
      let pushupCounter = 0;

      function updatePushupCounter(newFollowers) {
        const pushupsToAdd = newFollowers - currentFollowers;
        pushupCounter += pushupsToAdd * 10;
        document.getElementById('pushup-counter').textContent = pushupCounter;
        currentFollowers = newFollowers;
      }

      function resetPushupCounter() {
        const now = new Date();
        const midnight = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0, 0, 0);
        const secondsUntilMidnight = (midnight.getTime() - now.getTime()) / 1000;
        setTimeout(() => {
          pushupCounter = 0;
          document.getElementById('pushup-counter').textContent = pushupCounter;
          resetPushupCounter();
        }, secondsUntilMidnight * 1000);
      }

      function fetchFollowers() {
        fetch(apiEndpoint)
          .then(response => response.json())
          .then(data => {
            const newFollowers = data.followersCount;
            updatePushupCounter(newFollowers);
          })
          .catch(error => console.error('Error fetching follower count:', error));
      }

      fetchFollowers();
      resetPushupCounter();
      setInterval(fetchFollowers, 60000); // Update every minute
    </script>
  </body>
</html>
