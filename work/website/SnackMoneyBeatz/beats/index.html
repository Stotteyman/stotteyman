<!DOCTYPE html>
<html>
  <head>
    <title>Beat Shop</title>
    <link rel="stylesheet" type="text/css" href="style.css">
    <link rel="stylesheet" type="text/css" href="popout.css">
  </head>
  <body>
    <h1>Beat Shop</h1>
    <div class="container">
      <div class="beat-container">
        <div class="beat-list">
          <div class="beat">
            <img src="beat1.jpg" class="play-pause" data-audio="beat1.mp3">
            <div class="beat-info">
              <h3>Beat 1</h3>
              <button class="buy-btn">Info</button>
            </div>
          </div>
          <div class="beat">
            <img src="beat2.jpg" class="play-pause" data-audio="beat2.mp3">
            <div class="beat-info">
              <h3>Beat 2</h3>
              <button class="buy-btn">Info</button>
            </div>
          </div>
          <div class="beat">
            <img src="beat3.jpg" class="play-pause" data-audio="beat3.mp3">
            <div class="beat-info">
              <h3>Beat 3</h3>
              <button class="buy-btn">Info</button>
            </div>
          </div>
          <div class="beat">
            <img src="beat4.jpg" class="play-pause" data-audio="beat4.mp3">
            <div class="beat-info">
              <h3>Beat 4</h3>
              <button class="buy-btn">Info</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="popup">
      <div class="popup-box">
        <button id="close-btn">X</button>
        <img src="beat1.jpg" class="popup-play-pause" data-audio="beat1.mp3">
        <div class="popup-beat-info">
          <h3>Beat 1</h3>
          <div class="popup-media-bar">
            <audio id="audio-player" controls></audio>
          </div>
          <div class="popup-buy-info">
            <button class="buy-btn">Buy Now</button>
          </div>
        </div>
      </div>
    </div>

    <script type="text/javascript" src="playpause.js"></script>
    <script type="text/javascript" src="popout.js"></script>
    <script type="text/javascript" src="buy.js"></script>
  </body>
</html>
