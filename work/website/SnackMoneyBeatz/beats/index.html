<!DOCTYPE html>
<html>
  <head>
    <title>Beat Shop</title>
    <link rel="stylesheet" type="text/css" href="style.css">
  </head>
  <body>
    <h1>Beat Shop</h1>
    <div class="container">
      <div class="beat-container">
        <div class="beat-list">
          <div class="beat">
            <img src="beat1.jpg">
            <div class="beat-info">
              <h3>Beat 1</h3>
              <button class="buy-btn">Buy</button>
            </div>
          </div>
          <div class="beat">
            <img src="beat2.jpg">
            <div class="beat-info">
              <h3>Beat 2</h3>
              <button class="buy-btn">Buy</button>
            </div>
          </div>
          <div class="beat">
            <img src="beat3.jpg">
            <div class="beat-info">
              <h3>Beat 3</h3>
              <button class="buy-btn">Buy</button>
            </div>
          </div>
          <div class="beat">
            <img src="beat4.jpg">
            <div class="beat-info">
              <h3>Beat 4</h3>
              <button class="buy-btn">Buy</button>
            </div>
          </div>
          <div class="beat">
            <img src="beat5.jpg">
            <div class="beat-info">
              <h3>Beat 5</h3>
              <button class="buy-btn">Buy</button>
            </div>
          </div>
          <div class="beat">
            <img src="beat6.jpg">
            <div class="beat-info">
              <h3>Beat 6</h3>
              <button class="buy-btn">Buy</button>
            </div>
          </div>
          <div class="beat">
            <img src="beat7.jpg">
            <div class="beat-info">
              <h3>Beat 7</h3>
              <button class="buy-btn">Buy</button>
            </div>
          </div>
          <div class="beat">
            <img src="beat8.jpg">
            <div class="beat-info">
              <h3>Beat 8</h3>
              <button class="buy-btn">Buy</button>
            </div>
          </div>
        </div>
      </div>
      <div class="arrow-container">
        <span class="arrow left-arrow">&lt;</span>
        <span class="arrow right-arrow">&gt;</span>
      </div>
    </div>
    <script type="text/javascript" src="script.js"></script>
  </body>
</html>
