<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Beats for Sale!</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>
    <div class="container">
        <h1>Beats for Sale!</h1>
        <div class="beat-list">
            <div class="beat">
                <img src="beat1.jpg" alt="Beat 1">
                <audio controls>
                    <source src="beat1.mp3" type="audio/mp3">
                </audio>
                <div class="beat-info">
                    <h3>Beat 1</h3>
                    <button class="play-btn">Play</button>
                    <a href="https://google.com" target="_blank"><button>Buy Now</button></a>
                </div>
            </div>
            <div class="beat">
                <img src="beat2.jpg" alt="Beat 2">
                <audio controls>
                    <source src="beat2.mp3" type="audio/mp3">
                </audio>
                <div class="beat-info">
                    <h3>Beat 2</h3>
                    <button class="play-btn">Play</button>
                    <a href="https://google.com" target="_blank"><button>Buy Now</button></a>
                </div>
            </div>
            <div class="beat">
                <img src="beat3.jpg" alt="Beat 3">
                <audio controls>
                    <source src="beat3.mp3" type="audio/mp3">
                </audio>
                <div class="beat-info">
                    <h3>Beat 3</h3>
                    <button class="play-btn">Play</button>
                    <a href="https://google.com" target="_blank"><button>Buy Now</button></a>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
