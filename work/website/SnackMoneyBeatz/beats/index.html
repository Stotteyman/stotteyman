<!DOCTYPE html>
<html>
  <head>
    <title>Beat Shop</title>
    <link rel="stylesheet" type="text/css" href="style.css">
  </head>
  <body>
    <h1>Beat Shop</h1>
    <div class="container">
      <div class="beat-container">
        <div class="beat-list">
          <div class="beat">
            <img src="beat1.jpg" data-audio="audio1.mp3" class="play-pause">
            <div class="beat-info">
              <h3>Beat 1</h3>
              <button class="buy-btn">Buy</button>
            </div>
          </div>
          <div class="beat">
            <img src="beat2.jpg" data-audio="audio2.mp3" class="play-pause">
            <div class="beat-info">
              <h3>Beat 2</h3>
              <button class="buy-btn">Buy</button>
            </div>
          </div>
          <div class="beat">
            <img src="beat3.jpg" data-audio="audio3.mp3" class="play-pause">
            <div class="beat-info">
              <h3>Beat 3</h3>
              <button class="buy-btn">Buy</button>
            </div>
          </div>
          <div class="beat">
            <img src="beat4.jpg" data-audio="audio4.mp3" class="play-pause">
            <div class="beat-info">
              <h3>Beat 4</h3>
              <button class="buy-btn">Buy</button>
            </div>
          </div>
          <div class="beat">
            <img src="beat5.jpg" data-audio="audio5.mp3" class="play-pause">
            <div class="beat-info">
              <h3>Beat 5</h3>
              <button class="buy-btn">Buy</button>
            </div>
          </div>
          <div class="beat">
            <img src="beat6.jpg" data-audio="audio6.mp3" class="play-pause">
            <div class="beat-info">
              <h3>Beat 6</h3>
              <button class="buy-btn">Buy</button>
            </div>
          </div>
          <div class="beat">
            <img src="beat7.jpg" data-audio="audio7.mp3" class="play-pause">
            <div class="beat-info">
              <h3>Beat 7</h3>
              <button class="buy-btn">Buy</button>
            </div>
          </div>
          <div class="beat">
            <img src="beat8.jpg" data-audio="audio8.mp3" class="play-pause">
            <div class="beat-info">
              <h3>Beat 8</h3>
              <button class="buy-btn">Buy</button>
            </div>
          </div>
        </div>
      </div>
      <div class="arrow-container">
        <span class="arrow left-arrow">&lt;</span>
        <span class="arrow right-arrow">&gt;</span>
      </div>
    </div>
    <script type="text/javascript" src="playpause.js"></script>
    <script type="text/javascript" src="arrow.js"></script>
  </body>
</html>
