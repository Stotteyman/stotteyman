<!DOCTYPE html>
<html>

<head>
  <title>Beat Store</title>
  <link rel="stylesheet" type="text/css" href="style.css">
  <script src="popout.js"></script>
  <script src="playpause.js"></script>
  <script src="buy.js"></script>
</head>

<body>
  <header>
    <h1>Beat Store</h1>
  </header>
  <main>
    <div class="beat">
      <img class="beat__img" src="https://picsum.photos/id/237/400/400" alt="Beat Image" data-src="beat.mp3">
      <div class="beat__info">
        <h2 class="beat__name">Beat Name</h2>
        <div class="media-bar">
          <button class="playpause-button">Play/Pause</button>
          <progress class="progress-bar" value="0" max="100"></progress>
          <span class="time-display">0:00</span>
        </div>
        <button class="info-button">Info</button>
        <button class="buy-button" data-link="https://www.google.com/search?q=Beat+Name">Buy Now</button>
      </div>
    </div>
  </main>
  <footer>
    <p>&copy; 2023 Beat Store</p>
  </footer>

  <div class="popout" style="display: none;">
    <button class="close-button">×</button>
    <div class="popout__content">
      <img class="popout__img" src="https://picsum.photos/id/237/400/400" alt="Beat Image">
      <div class="popout__info">
        <h2 class="popout__name">Beat Name</h2>
        <div class="media-bar">
          <button class="playpause-button">Play/Pause</button>
          <progress class="progress-bar" value="0" max="100"></progress>
          <span class="time-display">0:00</span>
        </div>
        <button class="buy-button" data-link="https://www.google.com/search?q=Beat+Name">Buy Now</button>
      </div>
    </div>
  </div>
</body>

</html>
