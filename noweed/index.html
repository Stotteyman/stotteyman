<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>No Weed</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>I have not smoked weed since</h1>
        <h2 id="timestamp"></h2>
        <div id="timeSinceDetails" class="time-container">
            <div class="time-row lightest-orange">It's been <span id="years">0</span> years</div>
            <div class="time-row light-orange">It's been <span id="months">0</span> months</div>
            <div class="time-row orange">It's been <span id="weeks">0</span> weeks</div>
            <div class="time-row dark-orange">It's been <span id="days">0</span> days</div>
            <div class="time-row darker-orange">It's been <span id="hours">0</span> hours</div>
            <div class="time-row darkest-orange">It's been <span id="minutes">0</span> minutes</div>
            <div class="time-row darkest-orange">It's been <span id="seconds">0</span> seconds</div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
