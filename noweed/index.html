<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="title">_ days sober</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>I have been sober since</h1>
        <h2 id="timestamp"></h2>
        <div id="timeSince" class="time-container">
            <div class="time-row light-orange">It's been <span id="seconds"></span> seconds</div>
            <div class="time-row dark-orange">It's been <span id="minutes"></span> minutes</div>
            <div class="time-row dark-orange">It's been <span id="hours"></span> hours</div>
            <div class="time-row dark-orange">It's been <span id="days"></span> days</div>
            <div class="time-row dark-orange">It's been <span id="weeks"></span> weeks</div>
            <div class="time-row dark-orange">It's been <span id="months"></span> months</div>
            <div class="time-row dark-orange">It's been <span id="years"></span> years</div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
