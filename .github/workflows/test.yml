name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'legacy/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'legacy/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - run: npm ci
      - run: npm test -- --coverage
