<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stotteyman | Gary McCullouch Jr.</title>
  <meta name="description" content="Life is what you make it">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    html, body {
      margin: 0; padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #000; color: #fff;
      height: 100%; overflow: hidden;
    }
    .screen { display: none; width: 100%; height: 100%; position: absolute; top: 0; left: 0; background-color: #000; justify-content: center; align-items: center; flex-direction: column; }
    .screen.active { display: flex; }
    #lockscreen { text-align: center; }
    .clock-large { font-size: 3rem; margin-bottom: 20px; }
    .tap-instruction { color: #888; font-size: 1rem; animation: blink 2s infinite; }
    @keyframes blink { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
    #homescreen { flex-direction: column; }
    .status-bar { display: flex; justify-content: space-between; padding: 10px 20px; font-size: 0.9rem; background: #111; width: 100%; }
    .status-icons i { margin-left: 8px; }
    .app-grid { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; padding: 20px; justify-items: center; align-items: center; }
    .app-icon { display: flex; flex-direction: column; align-items: center; color: #fff; cursor: pointer; transition: transform 0.2s; }
    .app-icon:hover { transform: scale(1.1); }
    .app-icon i { font-size: 2rem; background: #222; padding: 20px; border-radius: 20px; margin-bottom: 8px; }
    .app-icon span { font-size: 0.8rem; }
    .dock { display: flex; justify-content: space-around; padding: 10px 0; background: rgba(20, 20, 20, 0.9); border-top: 1px solid #333; width: 100%; }
    .app-screen { display: none; flex-direction: column; height: 100%; background: #000; width: 100%; }
    .app-screen.active { display: flex; }
    .app-header { background: #111; padding: 15px; font-weight: bold; text-align: center; border-bottom: 1px solid #222; position: sticky; top: 0; z-index: 10; }
    .app-body { padding: 20px; overflow-y: auto; flex: 1; line-height: 1.6; }
    .back-btn { background: none; border: none; color: #ff6b00; font-size: 1.5rem; cursor: pointer; position: absolute; left: 10px; top: 10px; }
  </style>
</head>
<body>
  <div id="app">
    <div id="lockscreen" class="screen active">
      <div class="clock-large" id="lock-clock"></div>
      <p class="slogan">"Life is what you make it."</p>
      <p class="tap-instruction">Tap to unlock</p>
    </div>

    <div id="homescreen" class="screen">
      <div class="status-bar">
        <span id="status-time"></span>
        <span class="status-icons">
          <i class="fas fa-signal"></i>
          <i class="fas fa-wifi"></i>
          <i class="fas fa-battery-full"></i>
        </span>
      </div>
      <div class="app-grid">
        <div class="app-icon" data-app="about"><i class="fas fa-user"></i><span>Me</span></div>
        <div class="app-icon" data-app="live"><i class="fas fa-video"></i><span>Live</span></div>
        <div class="app-icon" data-app="contacts"><i class="fas fa-address-book"></i><span>Contacts</span></div>
        <div class="app-icon" data-app="music"><i class="fas fa-music"></i><span>Music</span></div>
        <div class="app-icon" data-app="photos"><i class="fas fa-images"></i><span>Photos</span></div>
        <div class="app-icon" data-app="settings"><i class="fas fa-cog"></i><span>Settings</span></div>
      </div>
      <div class="dock">
        <div class="app-icon" data-app="phone"><i class="fas fa-phone"></i></div>
        <div class="app-icon" data-app="browser"><i class="fas fa-globe"></i></div>
        <div class="app-icon" data-app="email"><i class="fas fa-envelope"></i></div>
        <div class="app-icon" data-app="camera"><i class="fas fa-camera"></i></div>
      </div>
    </div>

    <div class="app-screen" id="about">
      <div class="app-header"><button class="back-btn"><i class="fas fa-chevron-left"></i></button>About</div>
      <div class="app-body">
        <p>I'm Gary McCullouch Jr., aka Stotteyman — creator and founder of W.A.G.E. Society. I help people build brands, livestreams, and creative content using technology.</p>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const lockscreen = document.getElementById("lockscreen");
      const homescreen = document.getElementById("homescreen");
      const lockClock = document.getElementById("lock-clock");
      const statusTime = document.getElementById("status-time");
      const appIcons = document.querySelectorAll(".app-icon[data-app]");
      const appScreens = document.querySelectorAll(".app-screen");
      const backButtons = document.querySelectorAll(".back-btn");

      function updateClock() {
        const now = new Date();
        const timeString = now.toLocaleTimeString([], {
          hour: "2-digit",
          minute: "2-digit",
        });
        if (lockClock) lockClock.textContent = timeString;
        if (statusTime) statusTime.textContent = timeString;
      }

      updateClock();
      setInterval(updateClock, 1000);

      lockscreen.addEventListener("click", () => {
        lockscreen.classList.remove("active");
        homescreen.classList.add("active");
      });

      appIcons.forEach((icon) => {
        const appId = icon.dataset.app;
        const target = document.getElementById(appId);
        icon.addEventListener("click", () => {
          homescreen.classList.remove("active");
          if (target) target.classList.add("active");
        });
      });

      backButtons.forEach((btn) => {
        btn.addEventListener("click", () => {
          const screen = btn.closest(".app-screen");
          if (screen) screen.classList.remove("active");
          homescreen.classList.add("active");
        });
      });
    });
  </script>
</body>
</html>
