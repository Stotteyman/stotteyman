<style type="text/css">
/* CSS for the orange theme */
body {
font-family: Arial, sans-serif;
background: #fbe90a;
}
button {
display: block;
width: 100%;
margin-bottom: 10px;
padding: 8px 10px;
border: 3px solid #fb5600;
border-radius: 5px;
box-shadow: 2px 2px 2px #fb5600;
color: #000099;
font-size: 1.2rem;
background-color: #e69a00;
text-align: center;
text-decoration: none;
}
button:hover {
background-color: #ffca28;
}
#main {
position: absolute;
top: 50%;
left: 50%;
transform: translate(-50%, -50%);
text-align: center;
}
</style>
<script type="text/javascript">
// background music
window.onload = function() {
var audio = new Audio('js/music.mp3');
audio.play();
}
</script>
</head>
<body>
<div id="main">
<button>Home</button>
<button>KICK</button>
<button>Discord</button>
<button>Link3</button>
<button>Contact Me</button>
</div>
<script>
    document.querySelectorAll("button").forEach(function(button) {
      button.addEventListener("click", function() {
        switch (button.innerHTML) {
          case "Home":
            window.location.href = "/home";
            break;
          case "KICK":
            window.location.href = "https://kick.com/stotteyman";
            break;
          case "Discord":
            window.location.href = "https://discord.gg/7r8XQSP9sk";
            break;
          case "Link3":
            window.location.href = "https://link3.to/stotteyman";
            break;
          case "Contact Me":
            window.location.href = "/contact";
            break;
        }
      });
    });
    </script>
    
</body>
</html>
