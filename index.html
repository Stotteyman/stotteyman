<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:title" content="Stotteyman.com">
    <meta property="og:description" content="Explore the world of Stotteyman">
    <meta property="og:image" content="https://www.stotteyman.com/images/stotteyman.ico">
    <meta property="og:image:type" content="image/x-icon">
    <meta property="og:url" content="https://www.stotteyman.com">
    <link rel="stylesheet" href="header.css">
    <link rel="stylesheet" href="cards.css"> <!-- Include the CSS for the cards -->
    <link rel="shortcut icon" href="images/stotteyman.ico" type="image/x-icon">
    <title>Stotteyman.com</title>
</head>

<body>
    <div class="header-container">
        <div class="header" id="header">
            <!-- Header content will be loaded here -->
        </div>
    </div>

    <!-- Card elements -->
    <div class="card-wrapper">
        <div class="card-container">
            <img class="card-image" src="img/stotteyman.png" alt="Card Image">
            <div class="card-content">
                <div class="card-title">SandmanTV</div>
                <div class="card-social-links">
                    <a href="https://kick.com/stotteyman" class="card-social-icon">
                        <i class="fa-brands fa-kickstarter-k"></i>
                    </a>
                    <a href="https://twitter.com/Stotteyman" class="card-social-icon">
                        <i class="fab fa-twitter" aria-hidden="true"></i>
                    </a>
                    <a href="https://www.youtube.com/@Stotteyman" class="card-social-icon">
                        <i class="fab fa-youtube" aria-hidden="true"></i>
                    </a>
                </div>
            </div>
        </div>
        <!-- Add other card elements similarly -->
    </div>

    <script src="header.js"></script>
</body>

</html>
