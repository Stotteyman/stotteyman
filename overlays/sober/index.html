<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Days Sober Overlay</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="overlay-container">
        <div class="overlay-content">
            <h1>I have been sober for</h1>
            <h2 class="time-element years"></h2>
            <h2 class="time-element months"></h2>
            <h2 class="time-element weeks"></h2>
            <h2 class="time-element days"></h2>
            <h2 class="time-element hours"></h2>
            <h2 class="time-element minutes"></h2>
            <h2 class="time-element seconds"></h2>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
