<body>

<div class="page-container">
    <div class="page-page">
        <div class="page-top-bar">
            <img
                alt="Rectangle41379219"
                src="/images/stotteyman.png"
                class="page-rectangle4137"
            />
            <span class="page-text"><span>Stotteyman.com</span></span>
            <div class="page-navigation">
                <span class="page-text02"><span>Projects</span></span>
                <span class="page-text04"><span>Contact</span></span>
                <span class="page-text06"><span>Donate</span></span>
            </div>
        </div>
        <div class="page-section">
            <div class="page-container1">
                <span class="page-text08"><span>Contact</span></span>
                <div class="page-input">
                    <span class="page-text10"><span>Name</span></span>
                    <div class="page-textfield">
                        <input type="text" id="name" placeholder="Enter your name">
                    </div>
                </div>
                <div class="page-input1">
                    <span class="page-text14"><span>Email</span></span>
                    <div class="page-textfield1">

                    </div>
                </div>
                <div class="page-input2">
                    <span class="page-text18"><span>Message</span></span>
                    <div class="page-textfield2">
                        <textarea id="message" placeholder="Enter your message"></textarea>
                    </div>
                </div>
                <button class="page-button" onclick="sendMessage()">
                    <div class="page-seconday">
                        <span class="page-text22"><span>Cancel</span></span>
                    </div>
                    <div class="page-primary">
                        <span class="page-text24"><span>Send</span></span>
                    </div>
                </button>
            </div>
            <img
                alt="Vector2009245"
                src="/vector2009245-jw69.svg"
                class="page-vector200"
            />
        </div>
        <div class="page-section1">
            <div class="page-avatar"></div>
            <div class="page-container2">
                <span class="page-text26"><span>Gary Lee McCullouch</span></span>
            </div>
            <img
                alt="Vector2009250"
                src="/vector2009250-yas1.svg"
                class="page-vector2001"
            />
        </div>
        <div class="page-section2">
