<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Referral deals curated by stotteyman" />
  <title>Referral Deals</title>
  <link rel="stylesheet" href="/legacy/styles.css" />
  <style>
    body {
      background: linear-gradient(135deg, #1f1f1f, #333);
      color: #eee;
      overflow-x: hidden;
    }
    .site-header {
      box-shadow: 0 0 20px var(--accent-color);
      color: #fff;
    }
    section {
      padding: 1em;
      animation: fadeInUp 0.8s ease forwards;
    }
    h2 {
      color: #ffcc80;
      border-bottom: 2px solid var(--accent-color);
      margin-top: 2em;
    }
    .card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid #444;
      border-radius: 12px;
      padding: 1em;
      margin-bottom: 1.5em;
      box-shadow: 0 0 10px rgba(255, 102, 0, 0.2);
      transition: transform 0.3s, box-shadow 0.3s;
    }
    .card:hover {
      transform: scale(1.02);
      box-shadow: 0 0 25px rgba(255, 102, 0, 0.4);
    }
    .card-buttons {
      margin-top: 1em;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5em;
    }
    .card-buttons button {
      padding: 0.5em 1em;
      border: none;
      border-radius: 4px;
      background: var(--accent-color);
      color: #fff;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s, transform 0.2s;
    }
    .card-buttons button:hover {
      background: #ffa94d;
      transform: scale(1.05);
    }
    .modal {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.75);
      display: none;
      justify-content: center;
      align-items: center;
      animation: fadeIn 0.5s ease;
      z-index: 9999;
    }
    .modal-content {
      background: #1e1e1e;
      color: #fff;
      padding: 2em;
      border-radius: 12px;
      box-shadow: 0 0 20px var(--accent-color);
      text-align: center;
    }
    .close-btn {
      margin-top: 1em;
      background: gray;
    }
    @keyframes fadeIn {
      from {opacity: 0; transform: scale(0.9);}
      to {opacity: 1; transform: scale(1);}
    }
    @keyframes fadeInUp {
      from {opacity: 0; transform: translateY(20px);}
      to {opacity: 1; transform: translateY(0);}
    }
  </style>
  <script src="qrious.min.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a href="/" class="logo">stotteyman.com</a>
      <nav>
        <ul>
          <li><a href="/">Home</a></li>
          <li><a href="/blog/">Blog</a></li>
          <li><a href="/azoa.html">Azoa</a></li>
          <li><a href="/contact.html">Contact</a></li>
          <li><a href="/referrals/">Referrals</a></li>
          <li><a href="/discord.html">Discord</a></li>
        </ul>
      </nav>
    </div>
  </header>
  <main class="container">
    <div id="content">Loading…</div>
  </main>

  <div class="modal" id="infoModal">
    <div class="modal-content">
      <p id="modalText">No info available yet</p>
      <button class="close-btn" onclick="closeModal()">Close</button>
    </div>
  </div>

  <script>
    const sheetId = '19rRwlvb4V64NolwwDwRoh5NysDhSMr5Z';
    const defaultTabs = ['Banking', 'Cashback Rewards', 'Casino', 'Crypto'];

    async function getSheetTabs() {
      const url = `https://spreadsheets.google.com/feeds/worksheets/${sheetId}/public/basic?alt=json`;
      const res = await fetch(url);
      const json = await res.json();
      return json.feed.entry.map(e => e.title.$t);
    }

    async function fetchTab(tabName) {
      const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?sheet=${encodeURIComponent(tabName)}&tqx=out:json`;
      const res = await fetch(url);
      const text = await res.text();
      const json = JSON.parse(text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1));
      return json.table.rows;
    }

    function openModal() {
      document.getElementById('infoModal').style.display = 'flex';
      document.getElementById('modalText').textContent = 'No info available yet';
    }

    function openQR(link, name, description) {
      const modal = document.getElementById('infoModal');
      const content = document.getElementById('modalText');
      content.innerHTML = `<canvas id="qrCanvas"></canvas><h3>${name}</h3><p>${description}</p>`;
      new QRious({
        element: document.getElementById('qrCanvas'),
        value: link,
        size: 200,
        background: '#fff',
        foreground: '#000'
      });
      modal.style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('infoModal').style.display = 'none';
    }

    function shareLink(title, text, url) {
      if (navigator.share) {
        navigator.share({ title, text, url }).catch(() => {});
      } else {
        alert('Sharing not supported on this device.');
      }
    }

    (async () => {
      const contentDiv = document.getElementById('content');
      contentDiv.innerHTML = '';

      let activeTabs = [...defaultTabs];
      try {
        const liveTabs = await getSheetTabs();
        const tabsChanged = JSON.stringify(liveTabs) !== JSON.stringify(defaultTabs);
        if (tabsChanged) {
          console.log('Tab structure changed. Updating...');
          activeTabs = liveTabs;
        }
      } catch (e) {
        console.warn('Using default tab list due to fetch error.');
      }

      for (const tab of activeTabs) {
        try {
          const rows = await fetchTab(tab);
          if (!rows || rows.length <= 1) continue;

          const section = document.createElement('section');
          const title = document.createElement('h2');
          title.textContent = tab;
          section.appendChild(title);

          rows.slice(1).forEach(row => {
            const name = row.c[0]?.v?.trim();
            const description = row.c[1]?.v?.trim() || '';
            const link = row.c[2]?.v?.trim();

            if (!name || !link) return;

            const card = document.createElement('div');
            card.className = 'card';

            const h3 = document.createElement('h3');
            h3.textContent = name;
            card.appendChild(h3);

            const p = document.createElement('p');
            p.textContent = description;
            card.appendChild(p);

            const buttonGroup = document.createElement('div');
            buttonGroup.className = 'card-buttons';

            const signupBtn = document.createElement('button');
            signupBtn.textContent = 'Sign Up';
            signupBtn.onclick = () => window.open(link, '_blank');
            buttonGroup.appendChild(signupBtn);

            const shareBtn = document.createElement('button');
            shareBtn.textContent = 'Share';
            shareBtn.onclick = () => shareLink(name, description, link);
            buttonGroup.appendChild(shareBtn);

            const infoBtn = document.createElement('button');
            infoBtn.textContent = 'Info';
            infoBtn.onclick = () => openModal();
            buttonGroup.appendChild(infoBtn);

            const qrBtn = document.createElement('button');
            qrBtn.textContent = 'QR Code';
            qrBtn.onclick = () => openQR(link, name, description);
            buttonGroup.appendChild(qrBtn);

            card.appendChild(buttonGroup);
            section.appendChild(card);
          });

          contentDiv.appendChild(section);
        } catch (err) {
          console.error(`Error loading tab: ${tab}`, err);
        }
      }
    })();
  </script>
  <footer class="site-footer">
    <p>&copy; 2024 stotteyman.com</p>
  </footer>
</body>
</html>
