[build]
  command = "pnpm build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"
  PNPM_VERSION = "9.0.0"
  # Supabase config lives in Netlify env vars, not here. The previous hard-coded
  # values pointed at drpowbmmyxwmedaxcjdy, a project that no longer exists.
  # Current: W.A.G.E. Society project pqngaffhjqadrsntsvlp, schema `stotteyman`.

# Headers for security and performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-DNS-Prefetch-Control = "off"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    # connect-src carries the two chat sockets the overlay opens directly from the
    # browser: Kick's public Pusher endpoint and Twitch's anonymous IRC-over-WSS.
    # Without irc-ws.chat.twitch.tv here Twitch chat silently never connects.
    #
    # `script-src 'unsafe-inline'` is still required and is NOT an oversight: Next.js
    # streams hydration state in inline <script> tags, and removing it means nonces,
    # which Next only supports on dynamically rendered pages — it would turn the whole
    # static public site dynamic. Tracked as task 5-01. The JSON-LD blocks do not need
    # it (a non-JS `type` makes them data blocks, which script-src does not govern).
    #
    # base-uri stops an injected <base> tag from silently repointing every relative URL
    # on the page, and object-src kills the plugin vector outright. Both are free.
    #
    # Fonts are self-hosted by next/font now, so fonts.googleapis.com / gstatic.com are
    # gone from style-src and font-src.
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' 'unsafe-inline' https://cwallet.com https://orangeduckstudios.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; media-src 'self' blob: data: https:; connect-src 'self' https://cwallet.com https://api.cwallet.com https://pqngaffhjqadrsntsvlp.supabase.co wss://pqngaffhjqadrsntsvlp.supabase.co https://kick.com wss://ws-us2.pusher.com wss://ws.pusherapp.com https://sockjs-us2.pusher.com wss://irc-ws.chat.twitch.tv https://orangeduckstudios.com; frame-src 'self' https://kick.com https://*.kick.com https://player.kick.com https://cwallet.com; form-action 'self' https://checkout.stripe.com; frame-ancestors 'none';"

# The group structure page was published and is now back-office only. Deleting the
# route would leave a 404 on a URL search engines have already indexed; a 301 both
# retires it properly and stops it being re-crawled. The data behind it is separately
# revoked from anon on stotteyman.public_entities — removing the page is not what
# makes it private, since the anon key ships in the browser bundle.
[[redirects]]
  from = "/company"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/company/*"
  to = "/"
  status = 301
  force = true

# The #FreeEBZ petition page was removed. It was indexed and shared, so send its
# traffic home rather than serving a 404 to every existing link.
[[redirects]]
  from = "/ebz"
  to = "/"
  status = 301
  force = true
