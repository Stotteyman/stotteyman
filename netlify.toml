[build]
  command = "pnpm build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"
  PNPM_VERSION = "9.0.0"
  # Supabase config lives in Netlify env vars, not here. The previous hard-coded
  # values pointed at drpowbmmyxwmedaxcjdy, a project that no longer exists.
  # Current: W.A.G.E. Society project pqngaffhjqadrsntsvlp, schema `stotteyman`.

# Headers for security and performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "origin-when-cross-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-DNS-Prefetch-Control = "off"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # connect-src carries the two chat sockets the overlay opens directly from the
    # browser: Kick's public Pusher endpoint and Twitch's anonymous IRC-over-WSS.
    # Without irc-ws.chat.twitch.tv here Twitch chat silently never connects.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cwallet.com https://orangeduckstudios.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; media-src 'self' blob: data: https:; connect-src 'self' https://cwallet.com https://api.cwallet.com https://pqngaffhjqadrsntsvlp.supabase.co wss://pqngaffhjqadrsntsvlp.supabase.co https://kick.com wss://ws-us2.pusher.com wss://ws.pusherapp.com https://sockjs-us2.pusher.com wss://irc-ws.chat.twitch.tv https://orangeduckstudios.com; frame-src 'self' https://kick.com https://*.kick.com https://player.kick.com https://cwallet.com; form-action 'self' https://checkout.stripe.com; frame-ancestors 'none';"

[[redirects]]
  from = "/api/kick-chat"
  to = "/.netlify/functions/kick-chat"
  status = 200

# The #FreeEBZ petition page was removed. It was indexed and shared, so send its
# traffic home rather than serving a 404 to every existing link.
[[redirects]]
  from = "/ebz"
  to = "/"
  status = 301
  force = true
