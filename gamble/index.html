<!DOCTYPE html>
<html>
<head>
  <title>Play with Me</title>
  <style>
    button {
      padding: 10px 20px;
      font-size: 16px;
      background-color: #2196F3;
      color: #FFF;
      border: none;
      cursor: pointer;
    }

    button:hover {
      background-color: #0D47A1;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <h1>Play with Me</h1>

  <button onclick="window.open('https://shuffle.com?r=eV3zUYYCaq')">Shuffle.com</button>
  <button onclick="window.open('https://gamdom.com/r/freeplay2023')">Gamdom.com</button>
  <button onclick="window.open('https://luckybird.vip/?c=c_stotteyman')">LuckyBird.vip</button>
  <button onclick="window.open('https://stake.us/?c=10cb2c9c4a')">Stake.us</button>

  <script>
    const buttons = document.getElementsByTagName("button");
    for (let i = 0; i < buttons.length; i++) {
      buttons[i].addEventListener("mouseover", function() {
        this.style.fontSize = "20px";
      });

      buttons[i].addEventListener("mouseout", function() {
        this.style.fontSize = "16px";
      });
    }
  </script>
</body>
</html>
